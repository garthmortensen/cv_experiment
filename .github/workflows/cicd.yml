name: Build CV

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write   # release assets
  pages: write
  id-token: write

concurrency:
  group: cv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-base texlive-fonts-recommended texlive-latex-extra poppler-utils

      # Builds site + pdf + docx, then fails on unknown tags, >2 pages, or leaked #tags.
      - name: Build and check
        run: make all GOATCOUNTER=${{ vars.GOATCOUNTER }}

      - name: Include PDF/DOCX in site
        run: cp build/*.pdf build/*.docx build/*.md build/site/

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: build/site

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/cv_garthmortensen.pdf
            build/cv_garthmortensen.docx
            build/cv_garthmortensen.md

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
