<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$pagetitle$</title>
<link rel="stylesheet" href="assets/cv.css">
<script defer src="assets/cv.js"></script>
$if(goatcounter)$
<script data-goatcounter="https://$goatcounter$.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
$endif$
</head>
<body>
<nav id="toolbar" aria-label="CV view controls">
  <div class="row">
    <span class="label">View</span>
    <button type="button" data-view="recruiter" aria-pressed="true">Recruiter</button>
    <button type="button" data-view="tech" aria-pressed="false">Technical</button>
    <span class="sep"></span>
    <button type="button" id="expand-all">Expand all</button>
    <button type="button" id="collapse-all">Collapse all</button>
    <span class="sep"></span>
    <a href="https://github.com/garthmortensen/cv_experiment/releases/latest/download/cv_garthmortensen.pdf">PDF</a>
    <a href="https://github.com/garthmortensen/cv_experiment/releases/latest/download/cv_garthmortensen.docx">DOCX</a>
  </div>
  <div class="row" id="tagbar"><span class="label">Highlight</span></div>
</nav>
<main>
$body$
</main>
</body>
</html>
